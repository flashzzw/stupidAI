<script>
// Portable, in-memory transition model. No CLI, storage or DOM dependencies.
const scenes=[
 {name:'配置接入',title:'接入你的工作环境',desc:'选择环境、核对配置，再开始工作。连接成功和账号可用分别展示。',guide:'先检查两类 CLI，观察 Claude 认证缺失，再确认已就绪的 Codex 配置。',steps:[['check','检查环境'],['pickClaude','查看 Claude'],['register','尝试登记'],['pickCodex','选回 Codex'],['register','登记配置']]},
 {name:'交给 Lead',title:'一个目标，清楚的执行范围',desc:'说清要交付什么，沿用角色默认配置。能力来源与本次选择可以展开核对。',guide:'填写目标并交给 Lead，然后重复点击。目标与执行不会重复创建。',steps:[['sampleGoal','填入示例'],['start','交给 Lead'],['start','再次提交']]},
 {name:'打回修复',title:'每次通过，都对应一份产物',desc:'Reviewer 用证据打回，Implementer 修复后再验证。后续修改会使旧证据失效。',guide:'先观察权限样例失败，再修复、验证、交付；最后改动产物，检查旧证据是否失效。',steps:[['reviewFail','Reviewer 打回'],['fix','提交修复'],['reviewPass','验证当前产物'],['deliver','检查交付'],['editAgain','再次改动'],['deliver','尝试旧证据交付']]},
 {name:'人工接手',title:'先停止自动化，再交接输入',desc:'看到原会话不代表已经获得控制权。在途工具、终端草稿和执行身份都需要核对。',guide:'申请接手会先暂停自动派发；在途工具未结束时无法取得输入权。',steps:[['handoff','申请接手'],['verifyHandoff','尝试核对'],['settle','模拟工具结束'],['verifyHandoff','完成核对']]},
 {name:'恢复差异',title:'回到原来的会话与配置',desc:'普通重连沿用原快照。改配另存版本，切换供应商需要创建新尝试并交接。',guide:'先恢复原配置，再模拟在途改配；最后检查供应商切换为何不能冒充原会话恢复。',steps:[['resume','原配置恢复'],['busy','模拟工具在途'],['exclude','取消文档 MCP'],['apply','尝试改配'],['settle','模拟工具结束'],['apply','应用新快照'],['switchProvider','选择供应商 B'],['resume','尝试恢复']]}
];
function initial(scene){return {scene,step:0,checked:scene!==0,registered:scene!==0,cli:scene===4?'claude':'codex',ready:{codex:true,claude:scene!==0},path:'/home/dev/csv-project',goal:scene===1?'':'为现有项目增加按筛选条件导出 CSV，并补齐权限测试与使用说明。',created:scene>=2,task:scene===2?'reviewing':scene===3?'running':scene===4?'paused':'none',revision:1,gate:'pending',gateRevision:null,evidence:[],control:scene===3?'platform':'none',auto:scene===3,connected:scene!==0,inflight:scene===3,external:false,draft:false,alias:false,profile:'A',originalProfile:'A',snapshot:scene>=2?1:0,snapshots:scene>=2?[{version:1,mcp:true,profile:'A'}]:[],previousSessions:[],mcp:true,effectiveMcp:true,skills:true,attempt:1,session:scene>=2?'session-original':'未创建',sessionCount:scene>=2?1:0,message:'可使用上方逐步引导，也可自由操作下方按钮。',error:false,log:[]};}
function transition(current,type,value){
 const s=structuredClone(current);s.error=false;let message='';
 const reject=text=>{s.error=true;message=text;};
 switch(type){
 case 'pickCodex':s.cli='codex';message='已选择 Codex · 供应商 A。';break;
 case 'pickClaude':s.cli='claude';message='已选择 Claude · 供应商 A；就绪状态按该配置显示。';break;
 case 'cli':s.cli=value;message='已调整本次执行配置。';break;
 case 'path':s.path=value;s.checked=false;s.registered=false;message='项目目录已改变，需要重新检查。';break;
 case 'goal':s.goal=value;return s;
 case 'check':if(!s.path.startsWith('/')||s.path.includes('\\')){reject('请选择 WSL 内的 Linux 绝对路径，例如 /home/dev/csv-project。');break;}s.checked=true;s.connected=true;message='模拟检查完成：Codex 可用；Claude 会话可连接，认证仍待就绪。';break;
 case 'authReady':s.ready.claude=true;message='模拟 Claude 认证就绪。真实产品需按具体连接方式验证。';break;
 case 'alias':s.alias=true;message='两个配置名称指向同一状态目录；已标记为共享，不新增隔离实例。';break;
 case 'register':if(!s.checked){reject('请先检查所选环境与目录。');break;}if(!s.ready[s.cli]){reject('Claude 认证未就绪。可先使用已就绪的 Codex，或处理该配置的认证。');break;}s.registered=true;message='已登记 '+(s.cli==='codex'?'Codex':'Claude')+' · 供应商 A。原配置保持原位置。';break;
 case 'sampleGoal':s.goal='为现有项目增加按筛选条件导出 CSV，并补齐权限测试与使用说明。';message='示例目标已填入，可继续编辑。';break;
 case 'start':if(s.created){message='该目标已登记，返回同一执行；没有重复创建任务或会话。';break;}if(!s.goal.trim()){reject('请先填写希望交付的目标。');break;}if(!s.registered||!s.ready[s.cli]){reject('当前执行配置未就绪，请先完成配置接入。');break;}s.created=true;s.task='running';s.control='platform';s.auto=true;s.session='session-original';s.sessionCount=1;s.snapshot=1;s.effectiveMcp=s.mcp;s.snapshots=[{version:1,mcp:s.mcp,profile:'A'}];message='Lead 已接收目标。模拟安排：Explore 查边界，Implementer 实现，Reviewer 独立验证。';break;
 case 'missingAuth':s.ready[s.cli]=false;message='模拟当前执行配置认证失效，其他配置状态不受影响。';break;
 case 'reviewFail':s.gate='failed';s.gateRevision=s.revision;s.task='needs_fix';s.evidence.push({revision:s.revision,pass:false,text:'权限测试失败：未授权用户仍可导出。'});message='Reviewer 已打回：权限样例未满足；Lead 安排修复。';break;
 case 'fix':if(s.gate!=='failed'){reject('当前没有待修复的失败证据。');break;}s.revision++;s.gate='pending';s.gateRevision=null;s.task='reviewing';message='修复产物 r'+s.revision+' 已提交，等待独立验证；旧失败记录保留。';break;
 case 'reviewPass':if(s.task!=='reviewing'){reject('请先提交需要独立验证的当前产物。');break;}s.gate='passed';s.gateRevision=s.revision;s.evidence.push({revision:s.revision,pass:true,text:'模拟权限、筛选与 CSV 格式检查通过。'});s.task='verified';message='Reviewer 验证了产物 r'+s.revision+'。本演示没有实际运行测试。';break;
 case 'deliver':if(s.gate!=='passed'||s.gateRevision!==s.revision){reject('当前产物没有有效的通过证据，不能标记交付。');break;}s.task='delivered';s.auto=false;message='模拟交付完成：产物 r'+s.revision+' 与验证版本一致。';break;
 case 'editAgain':s.revision++;s.gate='stale';s.task='reviewing';message='产物已变成 r'+s.revision+'，旧证据不再覆盖当前改动。';break;
 case 'handoff':s.auto=false;s.control='checking';message='后续自动派发已暂停。正在核对原执行器、在途工作与输入归属。';break;
 case 'verifyHandoff':if(s.control!=='checking'){reject('请先申请接手，停止后续自动派发。');break;}if(s.external){reject('独立前台的严格接入尚未验证。保持原会话，不启动替代执行者。');break;}if(!s.connected||s.inflight||s.draft){reject(!s.connected?'连接中断，原执行可能仍在运行。请先恢复观察。':s.inflight?'原工具仍在执行，交接保持待核对。':'终端还有未提交草稿，请先在原终端处理。');break;}s.control='human';s.auto=false;message='模拟核对完成，输入交给你。原会话保持不变。';break;
 case 'settle':s.inflight=false;message='模拟原工具已结束，现可重新核对交接或应用配置。';break;
 case 'busy':s.inflight=true;message='模拟工具正在执行。当前配置与工作区占用继续保留。';break;
 case 'draft':s.draft=!s.draft;message=s.draft?'模拟原终端有未发送草稿；协议历史无法直接读到它。':'已模拟在原终端处理草稿。';break;
 case 'external':s.external=!s.external;s.control='checking';s.auto=false;message=s.external?'样本改为未验证的独立前台。仅发现记录不代表可接管。':'样本恢复为预共享后台（模拟）。';break;
 case 'disconnect':s.connected=false;s.auto=false;s.control='unknown';message='连接中断；不推断原执行已停止，也不新建会话。';break;
 case 'reconnect':s.connected=true;s.control='checking';s.auto=false;message='已模拟恢复原会话观察；输入权仍待核对。';break;
 case 'humanInput':if(s.control!=='human'){reject('输入权尚未交接，不能向会话发送。');break;}message='已在原会话模拟发送人工输入；自动派发继续暂停。';break;
 case 'skills':s.skills=value;message='已修改本次 Skill 选择；原生强制项保持。';break;
 case 'mcp':s.mcp=value;message='已修改待应用的文档 MCP 选择。';break;
 case 'exclude':s.mcp=false;message='文档 MCP 已从待应用选择中取消；当前快照仍保持。';break;
 case 'apply':if(s.profile!==s.originalProfile){reject('供应商或状态归属变化需要新尝试，不能覆盖原会话快照。');break;}if(s.inflight){reject('当前工具仍在使用旧配置，改配尚未生效。');break;}if(s.mcp===s.effectiveMcp){message='选择与当前快照一致，无需新增版本。';break;}s.snapshot++;s.effectiveMcp=s.mcp;s.snapshots.push({version:s.snapshot,mcp:s.mcp,profile:s.profile});message='模拟应用快照 v'+s.snapshot+'，从下一轮生效。旧历史与旧快照保留。';break;
 case 'switchProvider':s.profile=s.profile==='A'?'B':'A';message='待采用配置已改为供应商 '+s.profile+'，原会话仍绑定 '+s.originalProfile+'。';break;
 case 'resume':if(s.profile!==s.originalProfile){reject('原会话绑定供应商 '+s.originalProfile+'。切换为 '+s.profile+' 必须新建尝试并明确交接。');break;}if(s.inflight){reject('原工具仍在执行；继续观察即可，不重复启动。');break;}s.connected=true;s.task='running';message='已模拟恢复原会话与快照 v'+s.snapshot+'；没有新增尝试或会话。';break;
 case 'newAttempt':if(s.profile===s.originalProfile){reject('当前配置未改变，无需新建尝试。');break;}if(s.inflight){reject('原执行仍在途，先完成交接核对。');break;}s.previousSessions.push({id:s.session,profile:s.originalProfile,snapshot:s.snapshot});s.attempt++;s.originalProfile=s.profile;s.session='session-attempt-'+s.attempt;s.sessionCount++;s.snapshot++;s.effectiveMcp=s.mcp;s.snapshots.push({version:s.snapshot,mcp:s.mcp,profile:s.profile});s.task='paused';message='已显式创建尝试 '+s.attempt+'，保留原会话与成果；新会话尚未执行。';break;
 default:return s;
 }
 s.message=message;s.log.unshift(message);s.log=s.log.slice(0,5);return s;
}
</script>
<script>
let state=initial(0);
const el=id=>document.getElementById(id);
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(action,label,primary=false)=>`<button data-action="${action}"${primary?' class="primary"':''}>${label}</button>`;
const pill=(text,tone='')=>`<span class="badge ${tone}">${text}</span>`;
const names={none:'尚未开始',running:'执行中',reviewing:'待独立验证',needs_fix:'需要修复',verified:'当前产物已验证',delivered:'已交付',paused:'已暂停',platform:'工作台控制',checking:'交接待核对',human:'人工控制',unknown:'待核对',pending:'待验证',failed:'未通过',passed:'通过',stale:'已失效'};
function dispatch(action,value){state=transition(state,action,value);render();}
function selectScene(i){state=initial(i);render();}
function assets(){return `<details><summary>调整本次执行 · 能力与来源</summary><label class="checkline"><input type="checkbox" data-field="skills" ${state.skills?'checked':''}><span>项目工作方法 <small>共享 Skill · 来自角色默认；选中不等于已经使用</small></span></label><label class="checkline"><input type="checkbox" data-field="mcp" ${state.mcp?'checked':''}><span>文档查询 <small>共享 MCP 定义 · 连接及凭据随执行配置绑定</small></span></label><div class="hint">项目规则与原生内置能力继续生效。此处取消可选资源，不会删除历史中的已读内容。</div><div class="row">${pill('CLI 插件：未选用')}${pill('平台插件：独立管理')}</div></details>`;}
function tasks(){let data=[['E','Explore','检查筛选、权限与测试入口','只读发现已记录'],['I','Implementer','API、界面与说明的修改',state.task==='needs_fix'?'修复权限样例':state.task==='running'?'待派发':'产物 r'+state.revision],['R','Reviewer','独立验证当前产物',names[state.gate]]];return data.map(([icon,role,detail,status])=>`<div class="task"><span class="task-icon">${icon}</span><div><strong>${role}</strong><p>${detail}</p></div>${pill(status,status==='未通过'?'red':'')}</div>`).join('');}
function workspace(){
 if(state.scene===0)return `<h2>选择 WSL 项目</h2><div class="stack"><div class="two"><label class="field">发行版<select aria-label="发行版"><option>Ubuntu 24.04（模拟）</option></select></label><label class="field">Linux 用户<select aria-label="Linux 用户"><option>dev（模拟）</option></select></label></div><label class="field">项目目录<input type="text" data-field="path" value="${esc(state.path)}"></label><label class="field">CLI 执行配置<select data-field="cli"><option value="codex" ${state.cli==='codex'?'selected':''}>Codex · 供应商 A</option><option value="claude" ${state.cli==='claude'?'selected':''}>Claude · 供应商 A</option></select></label></div><div class="actions">${button('check','检查环境（模拟）')}${button('register','登记此配置',true)}</div>${state.checked?`<hr class="divider"><div class="row spread"><strong>Codex · 供应商 A</strong>${pill(state.ready.codex?'可用':'认证未就绪',state.ready.codex?'':'warn')}</div><p class="muted">原生共享后台 · 配置与状态来源已标明</p><div class="row spread"><strong>Claude · 供应商 A</strong>${pill(state.ready.claude?'可用':'需要登录',state.ready.claude?'':'warn')}</div><p class="muted">会话已连接${state.ready.claude?' · 认证已模拟就绪':' · 当前后台认证尚未就绪'}</p>`:''}<details><summary>试试异常与边界</summary><div class="actions">${button('authReady','模拟 Claude 认证就绪')}${button('alias','模拟目录别名')}</div><p class="muted">${state.alias?'配置 A 与别名指向同一状态目录，标记为共享。':'未发起账号测试请求；模拟检查不会产生用量。'}</p></details>`;
 if(state.scene===1)return `<div class="row spread"><h2>新建目标</h2>${pill('Lead / 默认 Profile')}</div><label class="field">希望交付什么<textarea data-field="goal" ${state.created?'readonly':''} placeholder="描述目标、约束和完成条件…">${esc(state.goal)}</textarea></label><p class="muted">项目：${esc(state.path)}</p><div class="hint">Lead · ${state.cli==='codex'?'Codex':'Claude'} / 供应商 A<br>范围：CSV 导出相关模块；保留现有权限行为。<br>模拟约束：总运行 2、同时写入 1；真实费用未知。</div>${assets()}<div class="actions">${button('start',state.created?'查看同一执行':'交给 Lead',true)}${button('sampleGoal','使用示例目标')}</div>${state.created?`<hr class="divider"><h3>当前安排（模拟）</h3>${tasks()}`:''}<details><summary>模拟启动失败</summary><div class="actions">${button('missingAuth','模拟当前认证失效')}</div></details>`;
 if(state.scene===2)return `<div class="row spread"><h2>CSV 导出 · 验证与修复</h2>${pill('当前产物 r'+state.revision)}</div>${tasks()}<div class="actions">${button('reviewFail','Reviewer 打回')}${button('fix','提交修复')}${button('reviewPass','验证当前产物',true)}${button('deliver','检查交付')}</div><hr class="divider"><h3>验证记录（模拟）</h3>${state.evidence.length?state.evidence.map(e=>`<div class="evidence"><strong>产物 r${e.revision} · ${e.pass?'通过':'失败'}</strong><p>${e.text}${e.revision!==state.revision?' · 不覆盖当前产物':''}</p></div>`).join(''):'<p class="muted">尚无验证结论。实现者提交不等于独立验证通过。</p>'}<div class="actions">${button('editAgain','模拟再次改动产物')}</div>`;
 if(state.scene===3)return `<div class="row spread"><h2>接续已有会话</h2>${pill(names[state.control],state.control==='checking'||state.control==='unknown'?'warn':'')}</div><div class="hint">${state.external?'独立前台 · 严格接入未验证':'Codex · 预共享后台（模拟）'}<br>原会话连续；所有操作均针对当前上下文。</div><dl class="kv"><dt>当前工作</dt><dd>${state.inflight?'工具正在执行':'工具已结束'}</dd><dt>后续自动派发</dt><dd>${state.auto?'已开启':'已暂停'}</dd><dt>终端草稿</dt><dd>${state.draft?'模拟：有待处理草稿':'模拟：已确认无待处理草稿'}</dd></dl><div class="actions">${button('handoff','申请接手',true)}${button('verifyHandoff','核对并交接输入')}${button('humanInput','模拟人工发送')}</div><details open><summary>模拟异常与核对结果</summary><div class="actions">${button('settle','模拟工具结束')}${button('draft',state.draft?'模拟草稿已处理':'模拟终端有草稿')}${button('disconnect','模拟断连')}${button('reconnect','恢复原会话观察')}${button('external',state.external?'选择预共享后台样本':'选择独立前台样本')}</div></details><p class="muted">原生 attach 成功不自动取得调度权；断连时也不认为原执行已停止。</p>`;
 return `<div class="row spread"><h2>继续前检查配置差异</h2>${pill('Claude · 已结束轮次')}</div><div class="two"><div class="hint"><strong>原执行</strong><br>供应商 ${state.originalProfile} · 快照 v${state.snapshot}<br>文档 MCP：${state.effectiveMcp?'启用':'禁用'}</div><div class="hint ${state.profile!==state.originalProfile?'warning':''}"><strong>待采用选择</strong><br>供应商 ${state.profile}<br>文档 MCP：${state.mcp?'启用':'禁用'}</div></div><label class="checkline"><input type="checkbox" data-field="mcp" ${state.mcp?'checked':''}><span>文档查询 MCP <small>改配需要核对生效边界，保留原历史。</small></span></label><div class="actions">${button('resume','按原绑定恢复',true)}${button('apply','应用能力差异')}${button('switchProvider','选择供应商 '+(state.profile==='A'?'B':'A'))}</div>${state.profile!==state.originalProfile?`<div class="hint warning">供应商已改变，不能将原会话 ID 直接交给新配置。</div>${button('newAttempt','创建新尝试并交接')}`:''}<hr class="divider"><h3>配置快照记录</h3>${state.snapshots.map(v=>`<div class="evidence">v${v.version} · 供应商 ${v.profile} · 文档 MCP ${v.mcp?'启用':'禁用'}</div>`).join('')}<details><summary>模拟运行状态</summary><div class="actions">${button('busy','模拟工具在途')}${button('settle','模拟工具结束')}</div></details>`;
}
function render(){
 const detailState=new Map([...document.querySelectorAll('details')].map(d=>[d.querySelector('summary').textContent,d.open]));
 const scene=scenes[state.scene];
 el('nav').innerHTML=scenes.map((s,i)=>`<button role="tab" id="tab-${i}" aria-controls="workspace" aria-selected="${i===state.scene}" data-scene="${i}"><span class="num">0${i+1}</span>${s.name}</button>`).join('');
 el('workspace').setAttribute('aria-labelledby','tab-'+state.scene);
 el('chapter').textContent='FLOW 0'+(state.scene+1)+' / 05';el('title').textContent=scene.title;el('description').textContent=scene.desc;
 el('guide').innerHTML=`<strong>逐步体验</strong><p>${scene.guide}</p><div class="steps">${scene.steps.map((s,i)=>`<span class="step ${i<state.step?'done':i===state.step?'current':''}">${i+1}. ${s[1]}</span>`).join('')}</div>${state.step<scene.steps.length?`<button class="compact" data-next>下一步：${scene.steps[state.step][1]}</button>`:'<span class="badge">本场景体验完毕 · 可自由探索</span>'}`;
 el('notice').innerHTML=`<div class="notice ${state.error?'error':''}">${esc(state.message)}</div>`;
 el('workspace').innerHTML=workspace();
 el('state').innerHTML=`<div class="row spread"><h2>当前状态</h2>${pill('模拟')}</div><dl class="kv"><dt>环境</dt><dd>Ubuntu · dev</dd><dt>连接</dt><dd>${!state.checked?'待检查':state.connected?'已连接':'已断开，待核对'}</dd><dt>执行配置</dt><dd>${state.cli==='codex'?'Codex':'Claude'} · 供应商 ${state.originalProfile}</dd><dt>配置接入</dt><dd>${state.registered?'已登记':'待登记'}</dd><dt>认证</dt><dd>${!state.checked?'待检查':state.ready[state.cli]?'模拟就绪':'未就绪'}</dd><dt>目标状态</dt><dd>${names[state.task]}</dd><dt>输入归属</dt><dd>${state.control==='none'?'未分配':names[state.control]}</dd><dt>在途工具</dt><dd>${state.inflight?'仍在执行':'无'}</dd><dt>自动派发</dt><dd>${state.auto?'开启':'暂停'}</dd><dt>有效快照</dt><dd>${state.snapshot?'v'+state.snapshot+' · MCP '+(state.effectiveMcp?'启用':'禁用'):'尚未生成'}</dd><dt>当前产物</dt><dd>${state.created?'r'+state.revision:'尚无产物'}</dd><dt>验证</dt><dd>${names[state.gate]}${state.gateRevision?' · r'+state.gateRevision:''}</dd><dt>会话 / 尝试</dt><dd>${state.sessionCount} / ${state.created?state.attempt:0}</dd></dl><details><summary>来源与身份详情</summary><p><code>${esc(state.path)}</code></p><p>原生身份（模拟）<br><code>${state.session}</code></p>${state.previousSessions.map(s=>`<p>保留的原会话（供应商 ${s.profile} · v${s.snapshot}）<br><code>${s.id}</code></p>`).join('')}<p class="muted">${state.alias?'配置别名共享原状态目录。':'环境、状态目录与原生 ID 共同确定会话。'}</p><p class="muted">费用未知；真实 CLI 的标题等辅助请求也需计入用量。</p></details><details open><summary>最近动作</summary><ol class="log">${state.log.length?state.log.map(t=>`<li>${esc(t)}</li>`).join(''):'<li>等待你的第一次操作。</li>'}</ol></details>`;
 document.querySelectorAll('details').forEach(d=>{const key=d.querySelector('summary').textContent;if(detailState.has(key))d.open=detailState.get(key);});
}
document.addEventListener('click',e=>{const scene=e.target.closest('[data-scene]');if(scene){selectScene(Number(scene.dataset.scene));el('tab-'+state.scene).focus();return;}const next=e.target.closest('[data-next]');if(next){const steps=scenes[state.scene].steps;if(state.step<steps.length){state=transition(state,steps[state.step][0]);state.step++;render();el('guide').querySelector('button')?.focus();}return;}const target=e.target.closest('[data-action]');if(target){const action=target.dataset.action;dispatch(action);document.querySelector(`[data-action="${action}"]`)?.focus();}});
document.addEventListener('input',e=>{if(['goal','path'].includes(e.target.dataset.field)){state=transition(state,e.target.dataset.field,e.target.value);}});
document.addEventListener('change',e=>{const field=e.target.dataset.field;if(field&&!['goal','path'].includes(field)){dispatch(field,e.target.type==='checkbox'?e.target.checked:e.target.value);document.querySelector(`[data-field="${field}"]`)?.focus();}});
el('reset').addEventListener('click',()=>selectScene(state.scene));
el('nav').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();let i=e.key==='Home'?0:e.key==='End'?4:(state.scene+(e.key==='ArrowRight'?1:4))%5;selectScene(i);el('tab-'+i).focus();});
render();
</script>
</html>
